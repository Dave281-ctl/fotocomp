# Fotocomp auf dem Synology NAS (Container Manager → Projekt) oder jedem Docker-Host.
#
# Diese Datei muss nicht angepasst werden. Alle persönlichen Werte (Passwörter,
# Adresse, Mailserver) stehen in der Datei .env im selben Ordner,
# Vorlage: nas.env.example.
#
# Ordner vorher anlegen:
#   /volume1/docker/fotocomp/photos  und  /volume1/docker/fotocomp/db

services:
  app:
    image: ghcr.io/dave281-ctl/fotocomp:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000' # links der Port auf dem NAS, rechts immer 3000
    environment:
      ORIGIN: ${ORIGIN}
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_DATABASE_NAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      UPDATE_TOKEN: ${UPDATE_TOKEN} # damit die App Updates bei Watchtower auslösen darf
    volumes:
      - /volume1/docker/fotocomp/photos:/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE_NAME}
    volumes:
      - /volume1/docker/fotocomp/db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME}']
      interval: 10s
      retries: 10

  # Installiert Updates der App. Wann und welche, entscheidet die App selbst
  # (Admin → Einstellungen → Updates); Watchtower führt nur auf ihren Auftrag aus.
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    command: --label-enable --cleanup --http-api-endpoints update
    environment:
      TZ: Europe/Zurich
      WATCHTOWER_HTTP_API_TOKEN: ${UPDATE_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
